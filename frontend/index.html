<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vibentra - Where Vibes Connect</title>
    <meta name="google-site-verification" content="i1WBYYgfQKhxF3udQ8Mi1EN6qytr9jD-lvQLoTpqtSQ" />
    <meta name="description" content="Vibentra is a modern music platform where vibes connect. Listen to your favorite tracks, manage playlists, and discover new artists.">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vibentra">
    <meta name="theme-color" content="#0F172A">
    <link rel="apple-touch-icon" href="./images/icon-512.png">
    <link rel="icon" href="./images/icon-192.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
            });
        }
    </script>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="logo-container">
            <img src="./images/vibentra-logo.png" alt="Vibentra Logo" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);">
            <h1>VIBENTRA</h1>
            <p>"Sound of India"</p>
            <div class="soundwave">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </div>

    <!-- The app logic will handle redirecting from splash to auth or home based on session -->
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>

    <meta name="description" content="Vibentra is a modern music platform where vibes connect. Listen to your favorite tracks, manage playlists, and discover new artists.">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vibentra">
    <meta name="theme-color" content="#0F172A">

    <link rel="icon" href="./images/icon-192.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css?v=1.6.3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // PWA Service Worker Registration & Update Logic
        if ('serviceWorker' in navigator) {
            let newWorker;
            let refreshing = false;
            
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });

            window.addEventListener('load', () => {
                // Dynamically inject the update popup UI
                const updatePopup = document.createElement('div');
                updatePopup.id = 'pwa-update-popup';
                updatePopup.style.cssText = `
                    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
                    background: var(--cards, #1E293B); color: white; padding: 15px 20px;
                    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                    display: none; align-items: center; gap: 15px; z-index: 9999;
                    border: 1px solid var(--primary, #7C3AED); font-family: sans-serif;
                `;
                updatePopup.innerHTML = `
                    <span style="font-size: 0.95rem;">A new version is available!</span>
                    <button id="pwa-update-btn" style="background: var(--primary, #7C3AED); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;">Update</button>
                `;
                document.body.appendChild(updatePopup);

                const updateBtn = document.getElementById('pwa-update-btn');
                updateBtn.addEventListener('click', () => {
                    updateBtn.textContent = 'Updating...';
                    updateBtn.disabled = true;
                    setTimeout(() => { updatePopup.style.display = 'none'; }, 200);

                    // Bulletproof update: Unregister SW, clear caches, and force reload
                    navigator.serviceWorker.getRegistrations().then(registrations => {
                        for (let registration of registrations) {
                            registration.unregister();
                        }
                    }).then(() => {
                        if ('caches' in window) {
                            caches.keys().then(names => {
                                for (let name of names) caches.delete(name);
                            });
                        }
                        setTimeout(() => {
                            window.location.href = window.location.pathname + '?v=' + new Date().getTime();
                        }, 800);
                    });
                });

                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                updatePopup.style.display = 'flex';
                            }
                        });
                    });
                    if (reg.waiting) {
                        newWorker = reg.waiting;
                        updatePopup.style.display = 'flex';
                    }
                }).catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="logo-container">
            <img src="./images/vibentra-logo.png" alt="Vibentra Logo" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);">
            <h1>VIBENTRA</h1>
            <p>"Sound of India"</p>
            <div class="soundwave">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </div>

    <!-- The app logic will handle redirecting from splash to auth or home based on session -->
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/app.js?v=1.5.8"></script>
</body>
</html>
